name: Contact to Discord

# Each issue titled "Contact..." is posted to Discord. The webhook lives in the repository secret
# DISCORD_WEBHOOK_URL, so it is never part of the site. Issue text is passed through env and jq,
# never interpolated into the shell, so a hostile title or body cannot run commands.
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  notify:
    if: startsWith(github.event.issue.title, 'Contact')
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          AUTHOR: ${{ github.event.issue.user.login }}
          URL: ${{ github.event.issue.html_url }}
        run: |
          jq -n \
            --arg title "$TITLE" --arg body "$BODY" --arg author "$AUTHOR" --arg url "$URL" \
            '{content: ("**New message from the portfolio**\n**\($title)**\n**From:** \($author)\n\($body[0:1400])\n\($url)"), allowed_mentions: {parse: []}}' \
            | curl --fail --silent --show-error -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
