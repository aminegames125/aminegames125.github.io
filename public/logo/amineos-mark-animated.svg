  <rect class="b" style="animation-delay:0.25s" x="58" y="106" width="44" height="44" rx="9" fill="#eceae4"/>
  <rect class="b" style="animation-delay:0.30s" x="154" y="106" width="44" height="44" rx="9" fill="#eceae4"/>
  <rect class="b" style="animation-delay:0.35s" x="202" y="106" width="44" height="44" rx="9" fill="#eceae4"/>
  <rect class="b" style="animation-delay:0.40s" x="10" y="58" width="44" height="44" rx="9" fill="#eceae4"/>
