  <rect class="ring" style="animation-delay:0.75s" x="106" y="106" width="44" height="44" rx="9"/>
  <rect class="b lit" style="animation-delay:0.75s,0.75s" x="106" y="106" width="44" height="44" rx="9" fill="#8dff4f"/>
